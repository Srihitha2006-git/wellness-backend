spring.application.name=wellness-backend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:wellness_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=mysql@2026!

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
# If you prefer not to recreate tables on every restart, change the above to 'update'
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8081

# ============ Gmail SMTP Configuration ============
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============ App Configuration ============
app.name=Wellness Application
app.support.email=support@wellnessapp.com
app.login.url=http://localhost:3000/login
